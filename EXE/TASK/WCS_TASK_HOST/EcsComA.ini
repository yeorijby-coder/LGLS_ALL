[Host]
; [LGLS] IMS(WMS) 스테이션 코드 해석 기준
;   ECS = 구 ECS 구축시드 DB(TB_CODEMASTER '022') 기준
;         101=TR#22 102=TR#24 103=TR#26 104=TR#29 105=TR#30
;   WMS = WMS 운영 DB(MC_STA_MST WH_TYP='AA01') 기준  ★기본
;         101=TR#22, 102=출발TR#30/도착TR#29(피킹존), 103=TR#24(제품입고대),
;         104=TR#26(원부자재불출대), 105/110=TR#3(C/V#2 방향전환)
;   하이랙 001~005 / 201~205 → 901~905 (공통)
StationMapMode=WMS

; [LGLS 2026-09-17] 완료(F) 보고 후 상위 응답을 못 받은 작업(09 잔류)을 다시 보고하는 간격(초)
;   처음 09 가 된 작업은 즉시 보고하고, 응답이 없으면 이 간격마다 다시 보낸다. 기본 60, 범위 5~3600
;   저장하면 5초 안에 반영된다(재기동 불필요)
RE_REPORT_09_SEC=60

; [LGLS 2026-09-17] 크레인 에러코드 마스터 구분 (EQP_ECD_MST.EQP_TYP)
;   SC_LGLS = PLC 알람 리스트(260917) 지상반 코드 11~93, 101~118  ★기본
;   SC_SFA  = 종전 SFA 코드표 (0054/0055 이중입고, 0058/0059 공출고)
ScErrCodeType=SC_LGLS
; 크레인 에러의 상위 보고 종류(ErrorKind) 판정 코드 (쉼표 구분, 숫자 비교)
;   알람 리스트 기준 73 좌측 렉 이중입고 / 74 우측 렉 이중입고 / 75 공출고
;   SC_SFA 로 되돌릴 때는 ScDualCodes=54,55 / ScEmptyCodes=58,59 / ScInFailCodes=56 / ScOutFailCodes=57
ScDualCodes=73,74
ScEmptyCodes=75
ScInFailCodes=
ScOutFailCodes=

; 개별 재정의 (재컴파일 없이 조정). 형식) IMS코드 = 출발내부, 도착내부
