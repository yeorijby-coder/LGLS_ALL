# =====================================================================
# HOST_SIM (WMS/IMS 시뮬레이터) 설정
# =====================================================================

[ECS]
# ECS 명령 채널: HOST_SIM 이 클라이언트로 접속 (ECS_PORT)
IP=127.0.0.1
PORT=9911

[REPORT]
# ECS 보고 채널: HOST_SIM 이 서버로 수신대기 (ECS 의 WMS_HOST:WMS_PORT 가 여기로 접속)
PORT=9910

[COMMON]
# [2026-07-30] 인터페이스명세서(WMS-ECS 20100311) Station No 체계로 통일:
#   S/C = 001~005 (BASE=0, WCS 가 901~905 로 변환. 구 201~205 도 WCS 가 계속 수용)
RACK_STATION_BASE=0
# 랙 Bay/Level 최대값 (셀 순환 범위)
MAX_BAY=10
MAX_LEVEL=10

# ---------------------------------------------------------------------
# 로직별 설정
#  IN_STATION  : 입고대 스테이션 코드   OUT_STATION : 출고대 스테이션 코드
#  SC          : 담당 스태커크레인 번호(콤마 구분) → Bank = 2k-1, 2k
# [2026-07-30] 스테이션 코드 = 명세서(20100311) 작업대 체계 (WCS_TASK_HOST WmsStationToMcNo 가 MC_NO 변환):
#   101=외부 입고 전용 입출고대(C/V#11=122)  102=Picking 작업대(입고=C/V#15=130 / 출고=C/V#14=129)
#   103=제품 입고대(현행 입고대 C/V#13=126)  104=원부자재 불출대(현행 출고대 C/V#12=124)
#   (TR 기반 MC_NO 직접 지정(122/124/126/129/130)도 하위호환으로 계속 동작)
# ---------------------------------------------------------------------

[LOGIC1]
ENABLED=1
# 제품 입고대(103)→랙, 랙→원부자재 불출대(104). 물리 설비는 종전과 동일(126 입고/124 출고).
IN_STATION=103
OUT_STATION=104
SC=1

[LOGIC2]
ENABLED=1
# Picking 작업대(102): 입고=C/V#15(130), 출고=C/V#14(129) — WCS 가 방향에 따라 자동 분기
IN_STATION=102
OUT_STATION=102
SC=2,3

[LOGIC3]
ENABLED=1
# 외부 입고 전용 입출고대(101)=C/V#11(122) 입출고 겸용. 입고 지시 전 M(101, 입고=0) 모드변경 선행 송신
IN_STATION=101
OUT_STATION=101
SC=4,5
