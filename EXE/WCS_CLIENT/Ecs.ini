; COLLECT_INTERVAL_MS : 설비 데이터를 DB 에서 읽어오는 주기(ms). 기본 300, 범위 100~5000.
;   값을 키우면 화면이 느려지고, 줄이면 DB 조회가 잦아진다.
COLLECT_INTERVAL_MS=300
ViewRetCnt=1

[MENU]
; ── 통신상태(EQUIP/HOST/SCH) 표시 ──────────────────────────────
;   STATUS_POS : 어디에 표시할지
;     RIBBON = 리본 위쪽 (기본)
;     BOTTOM = 화면 아래쪽 상태바 (종전 방식)
;   COMM_MODE : STATUS_POS=RIBBON 일 때의 모양
;     1 = 리본 탭 줄 오른쪽 끝에 한 줄로  (통신 · EQUIP · HOST · SCH)
;     2 = 탭 줄에 
; 크레인별 출고 대기 건수 표시 (1=표시, 0=숨김)
SCWAIT_VIEW=1
;         "통신" 이름표 + 리본 오른쪽 끝에 "통신" 그룹 (기본)
;   푸른색 = 정상 / 붉은색 = 단절
STATUS_POS=RIBBON
COMM_MODE=2
; 1=ECS 리본에 '사용자' 메뉴 표시, 0=숨김
USER_MENU=0
; 1=MANUAL 탭에 '반자동 TEST' 그룹 표시, 0=숨김
SEMITEST_MENU=1
; 1=ECS 리본 환경설정에 'INI 열기' 버튼 표시, 0=숨김
INI_MENU=1
; 1=ECS 리본에 '판넬 보기' 그룹(작업정보/상세정보/설비반송) 표시, 0=숨김
UIMODE_MENU=1
; 1=ECS 리본에 '처리' 그룹 표시, 0=숨김
;    (그룹 안의 버튼은 각자의 키로 따로 숨긴다 - 예: AUTOTIME_MENU)
PROCESS_MENU=1
; 1=ECS 리본 창고 모니터링에 '제품정보' 버튼 표시, 0=숨김
PRODINFO_MENU=1
; 1=ECS 리본 '처리' 그룹에 '시간 기반 자동 처리' 버튼 표시, 0=숨김
;    (버튼 선택 여부 자체는 DB COMMON_CODE SCH_OPT/AUTO_TIME 에 저장된다)
AUTOTIME_MENU=1
; 1=설비 대화상자(CV/SC/RTV)의 '확대' 버튼 표시, 0=숨김
ZOOM_BTN=0

; [LGLS 2026-09-11] 크레인/RGV 대화상자 클릭 경로의 단계를 LOG\ECS_UI_yyyymmdd.log 에 남긴다.
;   현장에서 "눌렀는데 안 열리고 멈춘다" 가 어디서 멎는지 가리기 위한 것. 0 = 끔.
UI_TRACE=1

; [LGLS 2026-09-11] 크레인/RGV 의 색·번호를 차상 화물 비트로 한 번 더 거를지
;   1 = 거른다(구 ECS 와 같은 판정. 설비가 내려놓는 즉시 꺼진다)
;   0 = 끈다(종전 동작. 작업이 다음 상태로 넘어가야 꺼진다)
;   현장 PLC 가 차상 비트를 안 채워 색이 안 뜨면 0 으로 두고 Client 재기동.
LOADBIT_GATE=1
