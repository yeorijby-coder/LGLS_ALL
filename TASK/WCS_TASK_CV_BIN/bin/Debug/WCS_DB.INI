[DB_2] --PostgreSql
--IP=10.99.43.240
--IP=10.99.43.238
IP=127.0.0.1,1435
DATABASE = LGLS_MCS_IO
PORT = 5432
USER = LGLS_IO
USER_PW = LGLS_IO


[PLC]
--MAKER : 1=XGT, 0=Melsec
MAKER=1
R_ADDR_MODE=DEC
D_ADDR_MODE=DOC
; [LGLS 2026-09-15] C/V 방향 워드 부호 (SYS_MAIN 라디오로도 바꿈). IN0=입고 0/출고 1 (현행), IN1=입고 1/출고 0
;   PLC 담당자가 래더에서 확인한 값이 입고=1/출고=0 이면 IN1. 쓰기·판독 양쪽에 적용, 재기동 없이 다음 지시부터.
DIR_CODE=IN0
; [LGLS 2026-09-23] C/V#11 전용 방향 부호 (미설정이면 위 DIR_CODE 를 따름)
DIR_CODE_CV11=IN1
[PROCESS]
--[2026-07-20] 물리 이관: 전 트랙 브리지 - COMM0~4=스테이션(PLC11~15), COMM5~14=라인(PLC01~10)
CNT=1
[CNF]
; ---- [LGLS 2026-09-17] C/V 순회 속도 옵션 (저장 후 2초 안에 반영, 재기동 불필요) ----
; CV_BULK_R         1=R 트래킹(작업번호)을 조각으로 한꺼번에 읽음(기본) / 0=설비별 개별 READ(종전)
; CV_EVT_BULK       1=이벤트 확인에 사이클 시작의 M 일괄 값을 씀(기본) / 0=설비별 개별 READ(종전)
; CV_HB_MS          통신상태(EQP_MST) 갱신 간격 ms. 1000(기본) / 0=설비마다(종전). Client 끊김 판정은 5초
; CV_CYCLE_SLEEP_MS 한 바퀴 뒤 쉬는 시간 ms (0~2000, 기본 200)
; CV_CYCLE_LOG_MS   한 바퀴가 이 값(ms)을 넘으면 30초에 한 번 [CYCLE] 로그 (기본 1000)
; UI_LOG_ASYNC      1=화면 로그 비동기(기본) / 0=동기(종전, 통신 스레드가 화면을 기다려 느려짐)
CV_BULK_R=1
CV_EVT_BULK=1
CV_HB_MS=1000
CV_CYCLE_SLEEP_MS=200
CV_CYCLE_LOG_MS=1000
UI_LOG_ASYNC=1
; [LGLS 2026-09-17] 설비 에러이력(EQP_ERR_HIS)에 남길 크레인 EQP_TYP (EQP_ECD_MST 코드표 구분)
;   SC_LGLS = PLC 알람 리스트(260917) 지상반 코드 11~93, 101~118 (기본) / SC_SFA = 종전 SFA 코드표
SC_ERR_TYP=SC_LGLS
; [LGLS 2026-09-17] 메인 PLC 알람 비트 읽기 (PlcAddressMap.xml <Global name="MainAlarm">, 저장 후 2초 안에 반영)
;   1 = 읽음(기본) : M5501~M550D → CV119~CV131 모터 과부하(CV_DATA.ERROR_CODE '0119'~'0131')
;                   M5601~M560F → RGV 알람 코드(알람코드 워드가 0 일 때 RTV_DATA_LGLS.ERR_CODE_RD)
;   0 = 읽지 않음
MAIN_ALM_BITS=1
; [LGLS 2026-09-22] RGV 비상정지 전파 (현장 요구)
;   ESTOP_RTV_CODES : 이 RTV 에러코드가 서면 아래 C/V 트랙도 같은 에러로 본다 (콤마 구분, 0=사용 안 함)
;                     82 = OP-8 비상정지. 크레인은 전파 대상이 아니다.
;   ESTOP_CV_TRACKS : 전파 대상 트랙(MC_NO). 기본 121~132 = C/V#11 12 13 14 15
ESTOP_RTV_CODES=82
ESTOP_CV_TRACKS=121,122,123,124,125,126,127,128,129,130,131,132

; [LGLS 2026-09-21] OP_MODE_USE : 설비 운전모드 워드(S/C·RGV Status +9, 1호기 D0169)를 읽어 자동/수동에 반영
;   0 = 쓰지 않음(기본, 종전대로 동작상태 DOWN 만 반영)   1 = 읽는다. 0 이면 수동 → 운전 화면에서 그 설비가 에러색
;   ★실 PLC 가 이 워드를 채우는지 확인한 뒤 1 로 바꾼다★ (구 ECS 는 읽기만 하고 쓰지 않았다)
OP_MODE_USE=0
RTV_ERR_TYP=RTV
WH_TYP=10
USERID=M-MELQCV

; [LGLS 2026-09-11] CV 스레드의 "전 설비 공통 알람"(M786/787, Ack M1539/1540) 처리 여부.
;   이 비트는 실은 S/C#1 자신의 알람 비트라 VehThread 와 중복이고, 워드 단위 쓰기 때문에
;   S/C#1 의 이송지시/완료 Ack 비트를 지울 수 있어 기본 0(끔). PLC 가 별도 공통 알람으로 쓰면 1.
CV_GLOBAL_ALARM=0

; [LGLS 2026-09-14] M 비트(Ack/이송지시 등) 쓰기 방식.
;   1 = 단일 비트 쓰기(%MX, 구 ECS mdDevSet/mdDevRst 와 같음). 같은 워드의 다른 비트를 덮지 않는다.
;   0 = 종전 워드 읽고-바꿔-되쓰기. 비교 시험용. 재기동 없이 바뀐다.
BIT_WRITE=1

; [LGLS 2026-09-16 23:03] 크레인 에러코드 판정 방식 (호출마다 읽음 - 재기동 불필요, RTV 제외)  ※사용자 지시로 모드 재정의
;   0 = 알람코드 워드(ALARM_SET_CODE, D0161+10k) 매 주기 읽어 0 아니면 에러, 0 이면 해제 (구 ECS 배차 규약). 보고 비트 없는 워드 값도 에러 → 3,5호기 유령
;   2 = 알람 보고 비트 래치 - ALARM_SET_REPORT 설 때 코드 래치, ALARM_RESET_REPORT 에서 해제 (구 ECS 팝업 알람 LED 규약)
;   3 = 2 + 워드가 0 이면 해제 (RESET 보고 펄스를 순회 사이에 놓쳐도 내려감)
;   4 = 2 + SUBSYSTEM_STATUS=DOWN 이면 에러색 (ERR_STA_FK1_RD=3, 상위 E 전문 없음 - 구 ECS 메인 화면 규약)
;   1 = 2 + 워드 0 해제 + DOWN 에러색 (구 ECS 와 가장 가까움)  ※종전 ErrCode 블록 용도는 폐기
SC_ERR_CODE_BLOCK=0

[COMM0]
EQMT=CV
--IP=192.100.1.110        ; 현장 PLC
IP=127.0.0.1 
CUR_PORT=2004
FROM_PORT=2004
TO_PORT=2004
PORT_CNT=1
CNT=1
PLC_NO=11
FR_TRACK=121
TO_TRACK=122
LOG_PATH=C:\WCS_TASK\CV
FILENAME=WCS_TASK_CV_COMM0

[VIEW]
; [LGLS 2026-09-03] 메인 화면 [로그 필터] 버튼 표시 여부
;   Y(기본) = 표시 / N = 버튼을 만들지 않음 (키가 없거나 빈 값이면 Y 로 본다)
LOG_FILTER_BTN=Y
; [LGLS 2026-09-04] 메인 화면 [시나리오 테스트] 버튼 표시 여부 (Y 기본 / N 숨김)
SCENARIO_BTN=Y
