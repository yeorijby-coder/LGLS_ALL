[PLC]
--MAKER : 1=XGT, 0=Melsec
MAKER=1
R_ADDR_MODE=DEC
D_ADDR_MODE=DOC
; [LGLS 2026-09-15] C/V 방향 워드 부호 (SYS_MAIN 라디오로도 바꿈). IN0=입고 0/출고 1 (현행), IN1=입고 1/출고 0
;   PLC 담당자가 래더에서 확인한 값이 입고=1/출고=0 이면 IN1. 쓰기·판독 양쪽에 적용, 재기동 없이 다음 지시부터.
DIR_CODE=IN0

[PROCESS]
--[2026-07-20] 물리 이관: 전 트랙 브리지 - COMM0~4=스테이션(PLC11~15), COMM5~14=라인(PLC01~10)
CNT=1
[CNF]
; [LGLS 2026-08-30] 설비 에러이력(EQP_ERR_HIS)에 남길 EQP_TYP.
;   Client [설비에러이력] 창이 이 값으로 EQP_ECD_MST 를 조인해 메시지를 표시한다.
;   SC_SFA = 현장 SFA 크레인 코드표 (0054 이중입고 / 0058 공출고 정의 보유)
SC_ERR_TYP=SC_SFA
RTV_ERR_TYP=RTV
WH_TYP=10
USERID=M-MELQCV

; [LGLS 2026-09-11] CV 스레드의 "전 설비 공통 알람"(M786/787, Ack M1539/1540) 처리 여부.
;   이 비트는 실은 S/C#1 자신의 알람 비트라 VehThread 와 중복이고, 워드 단위 쓰기 때문에
;   S/C#1 의 이송지시/완료 Ack 비트를 지울 수 있어 기본 0(끔). PLC 가 별도 공통 알람으로 쓰면 1.
CV_GLOBAL_ALARM=0

; [LGLS 2026-09-14] M 비트(Ack/이송지시 등) 쓰기 방식.
;   1 = 단일 비트 쓰기(%MX, 구 ECS mdDevSet/mdDevRst 와 같음). 같은 워드의 다른 비트를 덮지 않는다.
;   0 = 종전 워드 읽고-바꿔-되쓰기. 비교 시험용. 재기동 없이 바뀐다.
BIT_WRITE=1

; [LGLS 2026-09-15] 크레인 에러코드를 어디서 읽나.
;   0 = 알람코드 워드(ALARM_SET_CODE, 문서 D0161+10k) 상태 - 구 ECS 와 같음. 현장 기본.
;   1 = 주소맵 ErrCode 블록(D1160+10k, 문서에 없는 시뮬 예약영역)도 읽음 - EQP_SIM 이중입고(54)/공출고(58) 시험용.
;   현장에서 1 로 두면 PLC 가 다른 용도로 쓰는 D1180/D1200 값이 3·5호기 에러코드 0001 로 보인다.
; [LGLS 2026-09-16] 크레인 에러코드 판정 방식 (호출마다 읽음 - 재기동 불필요, RTV 무관)
;   0 = 알람코드 워드(ALARM_SET_CODE, D0161+10k) 매 주기 읽어 0 아니면 에러 (현장 기본)
;   1 = ErrCode 블록(D1160+10k, 시뮬 예약영역) - EQP_SIM 이중입고/공출고 시험용. 현장 금지(3·5호기 유령)
;   2 = 알람 보고 비트 래치 - ALARM_SET_REPORT 에서 코드 래치, ALARM_RESET_REPORT 에서 해제. 워드 잔존/타용도 값에 면역
SC_ERR_CODE_BLOCK=0

[COMM0]
EQMT=CV
--IP=192.100.1.110        ; 현장 PLC
IP=127.0.0.1 
CUR_PORT=2004
FROM_PORT=2004
TO_PORT=2004
PORT_CNT=1
CNT=1
PLC_NO=11
FR_TRACK=121
TO_TRACK=122
LOG_PATH=C:\WCS_TASK\CV
FILENAME=WCS_TASK_CV_COMM0

[VIEW]
; [LGLS 2026-09-03] 메인 화면 [로그 필터] 버튼 표시 여부
;   Y(기본) = 표시 / N = 버튼을 만들지 않음 (키가 없거나 빈 값이면 Y 로 본다)
LOG_FILTER_BTN=Y
; [LGLS 2026-09-04] 메인 화면 [시나리오 테스트] 버튼 표시 여부 (Y 기본 / N 숨김)
SCENARIO_BTN=Y
