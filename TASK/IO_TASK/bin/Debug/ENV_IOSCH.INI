[DB]
PROVIDER=OraOLEDB.Oracle.1
ALIAS=ORCL
--ALIAS=ORCL
USERID=SKI_WCS
PASSWORD=SKI_WCS
--LOGPATH=(구 개발 PC 경로 - 사용 안 함)
LOGPATH=.\bin\Debug\ECS_LOG
FILENAME=IOTASK_

[P_DB]
--IP=192.168.0.3
--IP=localhost
IP=localhost\SQLEXPRESS
--IP=10.117.3.174
DATABASE = LGLS_MCS_IO
PORT = 5432
USER = LGLS_IO
USER_PW = LGLS_IO
LOGPATH=.\bin\Debug\ECS_LOG
FILENAME=IOTASK_


[LOG_DEL]
YEAR = 2020
MONTH = 11
DAY = 05
HOUR = 14
MINUTE = 00
SECOND = 00
ADDVALUE = 30
ADDTYPE = MINUTE

[CNF]
; [LGLS] SC_AUTO_COMPLETE=0 : SC(스태커크레인) PLC 시뮬레이터가 없는 환경에서
;        SC 작업(20->21->25->완료)을 스케줄러 타이머로 자동 완료(시뮬레이션)한다.
;        실제 SC 시뮬레이터가 있으면 반드시 0 으로 두어야 한다.
SC_AUTO_COMPLETE = 0

; [LGLS 2026-08-30] SWEEP_RECOVER_ENABLE=1 : 자동 청소/복구 사용(기본)
;   묶이는 대상 - RecoverOutOrphans(고아 출고화물 복구) + 흔적/트래킹/RTV완료신호 청소
;   0 으로 두면 스케줄러가 상태를 건드리지 않는다. 디버그로 현장 상태를 붙잡아 둘 때 쓴다.
;   SYS_MAIN 화면의 [자동 청소/복구] 체크박스와 연동된다(화면에서 바꾸면 여기에 기록).
SWEEP_RECOVER_ENABLE =0

; [LGLS 2026-08-31] OUT_VIA_RGV_STATE=1 : 출고 RGV 구간을 상태(30/35)로 표현
;   입고는 원래 15 -> 30 -> 35 -> 20 으로 RGV 구간을 DB 에 남기는데 출고만 메모리 큐로
;   관리했다. 그래서 IO_TASK 가 죽으면 "순번 대기" 와 "반출 중" 의 구분이 사라져 고아가 됐다.
;   1 = 출고도 15 -> 30 -> 35 -> 15 -> 19 (고아가 생길 자리가 없어진다)
;   0 = 구 경로(m_lstOutPend / m_dicOutStn / RecoverOutOrphans)
OUT_VIA_RGV_STATE = 0


; [LGLS 2026-09-03] 화면 표시 설정
[VIEW]
; 메인 화면 우상단 [로그 필터] 버튼 표시 여부
;   Y = 표시(기본, 항목이 없어도 표시), N = 숨김
LOG_FILTER_BTN = Y
