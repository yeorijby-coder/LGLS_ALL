; 2026-09-30
;
; 접속 정보는 여기 평문으로 둔다.
;   앞 현장은 WmsInfo.dll 이 키(INFO=P1)로 주소를 풀어 주었는데,
;   그 dll 안에는 그 현장 서버만 들어 있어 여기서는 쓸 수 없다.

[DB Server]
SERVERNAME=localhost\SQLEXPRESS
DATABASE=LGLS_MCS_IO
; USERID 와 PASSWORD 를 비워 두면 Windows 인증으로 붙는다
USERID=
PASSWORD=

[APPLICATION]
TITLE=LGLS CLIENT 업로드
ICON=.\WMS.ICO
SETUP_BTN=1
UP_LOAD_KEY=1
DOWN_LOAD_PATH_SET=2
DOWN_LOAD_PATH_FIX=
UP_LOAD_TYPE=2

; 올릴 때 고르는 프로그램 구분. 이 현장은 WCS 하나다.
[DOWNLOAD PROGRAM]
CNT=1
1=WCS
