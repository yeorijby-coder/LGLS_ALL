[DB]
PROVIDER=OraOLEDB.Oracle.1
ALIAS=ORCL
USERID=SKI_WCS
PASSWORD=SKI_WCS
LOGPATH=.\bin\Debug\ECS_LOG
FILENAME=IOTASK_

[P_DB]
--IP=192.168.0.3
--IP=localhost
IP=127.0.0.1,1435
--IP=10.117.3.174
DATABASE = LGLS_MCS_IO
PORT = 5432
USER = LGLS_IO
USER_PW = LGLS_IO
LOGPATH=.\bin\Debug\ECS_LOG
FILENAME=IOTASK_

[CNF]
; LAND_BY_CARGO_SEC : 출고 착지를 트래킹 없이 물리 상태로 인정하기까지의 대기(초).
;   0 = 즉시. 기본 1. 설비가 H/S 트랙에 작업번호를 얹어 주지 않는 현장에서 쓴다.
LAND_BY_CARGO_SEC=1

; [LGLS 2026-08-31] OUT_VIA_RGV_STATE=1 : 출고 RGV 구간을 상태(30/35)로 표현
;   입고는 원래 15 -> 30 -> 35 -> 20 으로 RGV 구간을 DB 에 남기는데 출고만 메모리 큐로
;   관리했다. 그래서 IO_TASK 가 죽으면 "순번 대기" 와 "반출 중" 의 구분이 사라져 고아가 됐다.
;   1 = 출고도 15 -> 30 -> 35 -> 15 -> 19 (고아가 생길 자리가 없어진다)
;   0 = 구 경로(m_lstOutPend / m_dicOutStn / RecoverOutOrphans)
OUT_VIA_RGV_STATE = 0

; [LGLS 2026-09-16] OUT_HOLD_SEC : S/C#1 통로(C/V#2 103/104) 출고 유지 유예(초). 기본 3.
;   1호기 출고 크레인 완료 직후 이 시간 동안 통로를 출고로 유지해 입고 전환을 보류한다(미러 공백의 2회 전환 방지).
;   0 = 유예 없음(종전 동작, 입고->출고 재전환 2회가 날 수 있음). 호출마다 읽으므로 재기동 불필요.
OUT_HOLD_SEC = 3

; [LGLS 2026-09-17] IN_HS_STATUS : 입고가 RGV 로 통로(H/S)에 내려진 뒤의 작업상태.
;   15 = CV 구동중(기본, 종전)   16 = 통로CV 구동중(출고와 같은 표시). 호출마다 읽으므로 재기동 불필요.
;   스케줄러는 15/16 을 모두 읽으므로 값을 바꿔도 진행 중 작업이 서지 않는다.
IN_HS_STATUS = 16

; [LGLS 2026-09-17] MANUAL_DIR_HOLD_SEC : Client 화면 더블클릭(수동) 방향 전환 뒤 자동 방향 정합을 멈추는 시간(초). 기본 120, 0 = 억제 없음.
;   수동 전환은 설비 통신이 화물 보류 없이 즉시 쓴다. 이 시간이 지나면 다시 작업 상황에 따라 자동으로 맞춘다.
MANUAL_DIR_HOLD_SEC = 120

; [LGLS 2026-09-17 현장] CV2_DIR_MODE : S/C#1 통로(C/V#2 103) 방향 전환 방식. 저장 즉시 반영
;   1 = 교착 때만 전환(기본) - 통로를 현재 방향으로 쓰는 작업(출고 25/29/16, 입고 35/39/25/16/15실물)이 있으면 유지,
;       없으면 전환. 있어도 CV2_STALL_SEC 동안 무진행(크레인 25 제외)이면 교착으로 보고 한 번 전환
;       RGV 의 1호기행 입고 지시는 출고 29(H/S 에 막 내림)·16 도 점유로 보고 보류
;       대기 작업만으로는 미리 바꾸지 않고 지시 직전에 바꾼다. 반대 방향이 필요하면 즉시 지시(같은 방향만 15초 중복 억제)
;       교착 해제 전환은 설비 통신이 화물 보류 없이 즉시 쓴다(DIRF). OUT_HOLD_SEC 는 모드 1 에서 쓰지 않는다
;   2 = 통로 사용권 - 크레인 1호기 출고 지시 시 출고 사용권, RTV 1호기행 입고 지시 시 입고 사용권. 상대 사용권이 있으면 지시 안 함
;       방향은 그 지시를 낼 때만 바꿈. 출고 사용권은 RTV 가 싣고 통로를 벗어나면, 입고 사용권은 크레인 입고 지시 때 풀림
;   0 = 종전 (입고 진행 우선으로 수시 전환)
CV2_DIR_MODE = 2
; CV2_STALL_SEC : 교착 판정 무진행 시간(초). 기본 60, 최소 10
CV2_STALL_SEC = 60
; CV2_FAIR (모드 2) : 0 = 출고 우선(기본, 출고가 연달아 있으면 RTV 가 출고를 계속 싣는다) / 1 = 번갈아 쓰기(더 오래 기다린 쪽)
CV2_FAIR = 0

; [LGLS 2026-09-17] SC_DUAL_CODES / SC_EMPTY_CODES : 크레인 이중입고·공출고 에러코드(쉼표 구분).
;   PLC 알람 리스트(260917) 기준 이중입고 73 = 좌측 렉, 74 = 우측 렉 / 공출고 75.
;   현재 MarkErrorJobStatus(에러 작업상태 표시)가 주석 처리되어 있어, 크레인 데이터 갱신(UpdateScData)에서
;   재지정 지시를 허용할 에러인지 판정(bAllowRedirectErr)하는 데에만 쓰인다. 호출마다 읽으므로 재기동 불필요.
SC_DUAL_CODES=73,74
SC_EMPTY_CODES=75

; [LGLS 2026-09-03] 화면 표시 설정
[VIEW]
; 메인 화면 우상단 [로그 필터] 버튼 표시 여부
;   Y = 표시(기본, 항목이 없어도 표시), N = 숨김
LOG_FILTER_BTN = Y
