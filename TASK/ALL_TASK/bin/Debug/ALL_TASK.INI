; ALL_TASK 설정
; 각 태스크의 접속/운전 설정은 종전 그대로 WCS_DB.INI / ENV_IOSCH.INI / EcsComA.ini 를 읽는다.

[LOG]
; DIR       : 로그 뿌리 폴더. 비우면 <실행파일 폴더>\LOG
; KEEP_DAYS : 보관 일수 (기본 365 = 1년). 파일과 all_task_log 양쪽에 적용
; DB        : 1=all_task_log 테이블에도 적재, 0=파일만
DIR=
KEEP_DAYS=365
DB=1

[AUTOSTART]
; ALL_TASK 를 켤 때 자동으로 기동할 태스크 (1=자동기동, 0=수동)
; 기동 순서는 EQP -> IO -> HOST 로 고정돼 있다.
EQP=0
IO=0
HOST=0
