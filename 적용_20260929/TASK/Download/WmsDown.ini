; LGLS Client 배포 - 내려받는 쪽(EcsClient.exe)
; 2026-09-30
;
; Client 를 띄우기 전에 DB 와 견주어, 바뀐 파일만 내려받고 Client 를 실행한다.

[DB Server]
SERVERNAME=localhost\SQLEXPRESS
DATABASE=LGLS_MCS_IO
; USERID 와 PASSWORD 를 비워 두면 Windows 인증으로 붙는다
USERID=
PASSWORD=

; 내려받기가 끝나면 차례로 실행한다. 번호 순서대로 돈다.
[RUN_FILE]
FILE1=.\Ecs.exe

[APPLICATION]
TITLE=LGLS CLIENT
FORM_PICTURE=.\WmsDown.JPG
ICON=.\WCS.ico
SETUP_BTN=1
DOWN_LOAD_PATH_SET=1
DOWN_LOAD_COMP=1
DOWN_LOAD_START=1
DOWN_LOAD_PROGRAM=WCS

; 마지막으로 내려받은 때를 프로그램이 스스로 적는다 - 손대지 않는다.
[DOWN_FILE]
