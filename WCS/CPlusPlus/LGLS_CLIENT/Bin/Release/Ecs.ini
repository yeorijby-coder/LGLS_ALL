ViewRetCnt=1

[MENU]
; ── 통신상태(EQUIP/HOST/SCH) 표시 ──────────────────────────────
;   STATUS_POS : 어디에 표시할지
;     RIBBON = 리본 위쪽 (기본)
;     BOTTOM = 화면 아래쪽 상태바 (종전 방식)
;   COMM_MODE : STATUS_POS=RIBBON 일 때의 모양
;     1 = 리본 탭 줄 오른쪽 끝에 한 줄로  (통신 · EQUIP · HOST · SCH)
;     2 = 탭 줄에 "통신" 이름표 + 리본 오른쪽 끝에 "통신" 그룹 (기본)
;   푸른색 = 정상 / 붉은색 = 단절
STATUS_POS=RIBBON
COMM_MODE=2
USER_MENU=0

; 크레인별 출고 대기 건수 표시 (1=표시, 0=숨김)
SCWAIT_VIEW=0

; 1=MANUAL 탭에 '반자동 TEST' 그룹 표시, 0=숨김
SEMITEST_MENU=0

; 1=ECS 리본 환경설정에 'INI 열기' 버튼 표시, 0=숨김
INI_MENU=1

; 1=ECS 리본에 '판넬 보기' 그룹(작업정보/상세정보/설비반송) 표시, 0=숨김
UIMODE_MENU=1


; 1=ECS 리본 창고 모니터링에 '제품정보' 버튼 표시, 0=숨김
PRODINFO_MENU=0

; 1=ECS 리본에 '처리' 그룹 표시, 0=숨김
;    (그룹 안의 버튼은 각자의 키로 따로 숨긴다 - 예: AUTOTIME_MENU)
PROCESS_MENU=0
; 1=ECS 리본 '처리' 그룹에 '시간 기반 자동 처리' 버튼 표시, 0=숨김
;    (버튼 선택 여부 자체는 DB COMMON_CODE SCH_OPT/AUTO_TIME 에 저장된다)
AUTOTIME_MENU=0

; 1=설비 대화상자(CV/SC/RTV)의 '확대' 버튼 표시, 0=숨김
ZOOM_BTN=1
